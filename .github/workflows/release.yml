name: release

# 推 tag（如 v2.16.0）即出正式包：DMG + appcast.xml + GitHub Release。
#
# 双路径设计（v3.0 工程化）：
#   · 配了 Apple 签名/公证 secrets → Developer ID 分层签名 + notarytool 公证 + stapler 装订
#   · 没配                       → 退回自签，照样产出可下载的 DMG
#     （用户首次打开需右键「打开」；未公证时 Sparkle 自动更新的体验也略差）
#   两条路径都产出 appcast.xml。
#
# ⚠️ 前置条件：更新通道要求 feed 能被**匿名**拉取。仓库私有 → 已安装的用户
#    永远收不到更新（详见 docs/RELEASING.md「更新通道的前提」）。
#    本工作流第 3 步会显式检查并告警。
#
# ⚠️ 条件判断一律写在 shell 里，**不用 step 级 `if: ${{ env.X != '' }}`**：
#    能否在 if 里引用某个上下文（env / secrets…）取决于 GitHub 的上下文可用性表，
#    写错了不会报错、只会静默把整步跳过。`[ -n "${X}" ]` 在任何情况下都成立，
#    而且本地能逐行照跑照验。少一层魔法。
#
# 需要的 Secrets（全部可选，配了就自动升级到正式签名路径）:
#   APPLE_CERTIFICATE_P12         Developer ID Application 证书（.p12 的 base64）
#   APPLE_CERTIFICATE_PASSWORD    .p12 的密码
#   APPLE_ID                      Apple 开发者账号邮箱
#   APPLE_TEAM_ID                 团队 ID
#   APPLE_APP_PASSWORD            App 专用密码（appleid.apple.com 生成）
#   SPARKLE_PRIVATE_KEY           Sparkle EdDSA 私钥全文（scripts/sparkle_keys.sh 导出）
# 未配 SPARKLE_PRIVATE_KEY 时 appcast 会退回钥匙串——CI 上取不到，所以正式发布务必配置。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 同一 tag 只允许一条流水线在跑，避免两个 Release 打架
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
  SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 VERSION 一致
        run: |
          VERSION="$(tr -d ' \t\r\n' < VERSION)"
          echo "VERSION=${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "${TAG}" != "${VERSION}" ]; then
              echo "::error::tag v${TAG} 与 VERSION=${VERSION} 不一致 —— 发版前先同步 VERSION 与 CHANGELOG"
              exit 1
            fi
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: 跑全量测试
        run: swift test

      # 检查的是「匿名能不能拉到 appcast」这件事本身（而不是仓库设置），
      # 因为 Sparkle 就是不带你任何凭证去拉 feed 的。
      - name: 检查更新通道可达性
        run: |
          CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
          echo "匿名访问 ${GITHUB_REPOSITORY} → HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "::warning::仓库非公开（HTTP ${CODE}）。Sparkle 匿名拉取 \
          https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml 会 404，\
          已安装的用户收不到更新。修法见 docs/RELEASING.md「更新通道的前提」。"
          fi

      - name: 准备签名身份
        run: |
          if [ -z "${APPLE_CERTIFICATE_P12}" ]; then
            echo "未配置 APPLE_CERTIFICATE_P12 —— 走自签路径"
            echo "SIGNED=no" >> "${GITHUB_ENV}"
            exit 0
          fi

          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"

          # 用 openssl 而不是 base64：macOS 自带 base64 解码开关在 -D / --decode
          # 之间随系统版本变化，openssl base64 -d 没有这个歧义（换行也照样吃）。
          printf '%s' "${APPLE_CERTIFICATE_P12}" > "${RUNNER_TEMP}/cert.b64"
          openssl base64 -d -in "${RUNNER_TEMP}/cert.b64" -out "${RUNNER_TEMP}/cert.p12"

          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "${KEYCHAIN_PW}" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" \
            $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN}" \
                      | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "${IDENTITY}" ]; then
            echo "::error::证书导入后找不到 Developer ID Application 身份 —— .p12 内容或密码可能不对"
            exit 1
          fi
          echo "SIGN_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"
          echo "SIGNED=yes" >> "${GITHUB_ENV}"
          echo "签名身份: ${IDENTITY}"

      - name: 构建 App
        run: bash build.sh --dist-only

      - name: 公证并装订 App
        run: |
          if [ "${SIGNED:-no}" != "yes" ] || [ -z "${APPLE_ID}" ]; then
            echo "未配 Developer ID 证书或 Apple 账号 —— 跳过公证"
            exit 0
          fi
          ditto -c -k --keepParent "dist/随手迁.app" "${RUNNER_TEMP}/app.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/app.zip" \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" --wait
          xcrun stapler staple "dist/随手迁.app"

      - name: 打包 DMG
        run: bash scripts/package_dmg.sh --no-build

      - name: 公证并装订 DMG
        run: |
          if [ "${SIGNED:-no}" != "yes" ] || [ -z "${APPLE_ID}" ]; then
            echo "未配 Developer ID 证书或 Apple 账号 —— 跳过公证"
            exit 0
          fi
          xcrun notarytool submit "dist/随手迁-${VERSION}.dmg" \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" --wait
          xcrun stapler staple "dist/随手迁-${VERSION}.dmg"
          xcrun stapler validate "dist/随手迁-${VERSION}.dmg"

      - name: 从 CHANGELOG 抽出版本说明
        run: |
          awk -v ver="${VERSION}" '
            index($0, "## " ver) == 1 { grab=1; next }
            grab && index($0, "## ") == 1 { exit }
            grab { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md 里找不到「## ${VERSION}」段落，无法生成更新说明"
            exit 1
          fi
          # Sparkle 的更新弹窗会读与安装包同名的说明文件（generate_appcast 一并收进 appcast）
          cp release_notes.md "dist/随手迁-${VERSION}.md"
          echo "--- release_notes.md ---"
          cat release_notes.md

      - name: 生成 appcast.xml
        run: bash scripts/make_appcast.sh

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            "dist/随手迁-${VERSION}.dmg" \
            "dist/appcast.xml" \
            --title "随手迁 v${VERSION}" \
            --notes-file release_notes.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: suishouqian-dist
          path: |
            dist/*.dmg
            dist/appcast.xml
