name: release

# 推 tag（如 v2.16.0）即出正式包：DMG + appcast.xml + GitHub Release。
#
# 双路径设计（v3.0 工程化）：
#   · 配了 Apple 签名/公证 secrets → Developer ID 分层签名（含 Hardened Runtime）
#                                   + notarytool 公证 + stapler 装订
#   · 没配                       → 退回自签，照样产出可下载的 DMG
#     （用户首次打开需右键「打开」；未公证时 Sparkle 自动更新的体验也略差）
#   两条路径都产出 DMG；**appcast 需要 SPARKLE_PRIVATE_KEY**（CI runner 上没有
#   登录钥匙串，没有私钥就签不出 appcast，此时流水线会明确失败而不是发出半成品）。
#
# ⚠️ 前置条件：更新通道要求 feed 能被**匿名**拉取。仓库私有 → 已安装的用户
#    永远收不到更新（详见 docs/RELEASING.md「更新通道的前提」）。
#    本工作流第 3 步会显式检查并告警。
#
# ⚠️ 条件判断一律写在 shell 里，**不用 step 级 `if: ${{ env.X != '' }}`**：
#    能否在 if 里引用某个上下文（env / secrets…）取决于 GitHub 的上下文可用性表，
#    写错了不会报错、只会静默把整步跳过。`[ -n "${X}" ]` 在任何情况下都成立，
#    而且本地能逐行照跑照验。少一层魔法。
#
# ⚠️ secrets 只在**真正需要它的那一步**注入（v3.0.1）：此前挂在 workflow 级 env，
#    等于 `swift test`、SwiftPM 解析 Package.swift 都继承了 Sparkle 私钥，
#    仓库内任意可执行代码都能把它传出去。
#
# 需要的 Secrets（配了证书就自动升级到正式签名路径）:
#   SPARKLE_PRIVATE_KEY           Sparkle EdDSA 私钥全文（scripts/sparkle_keys.sh 导出）
#                                 **正式发版必填**：不配则 CI 生成不了 appcast
#   APPLE_CERTIFICATE_P12         Developer ID Application 证书（.p12 的 base64）
#   APPLE_CERTIFICATE_PASSWORD    .p12 的密码
#   APPLE_ID                      Apple 开发者账号邮箱
#   APPLE_TEAM_ID                 团队 ID
#   APPLE_APP_PASSWORD            App 专用密码（appleid.apple.com 生成）

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例 v2.16.0，必须已经存在）'
        required: true
        type: string

permissions:
  contents: write

# 同一 tag 只允许一条流水线在跑，避免两个 Release 打架
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # macos-26 = macOS 26 SDK（与 tests.yml 保持一致）。
    # 本项目用 `Glass` / `.glassEffect`，旧 SDK 里连类型都不存在，编译必挂；
    # 此前是 macos-14（Swift 5.10），发版流水线连第一步编译都过不去，
    # DMG 与 Release 一个都出不来。
    runs-on: macos-26
    steps:
      # fetch-depth: 0 —— workflow_dispatch 手动发布时要能校验目标 tag 确实存在
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析并校验发布 tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::缺少发布 tag（tag 推送或 workflow_dispatch 的 tag 输入）"
            exit 1
          fi
          # tag 必须已经存在。此前 tag↔VERSION 校验被 `if GITHUB_REF_TYPE = tag` 包着，
          # 手动触发时直接跳过，随后 gh release create 会在**分支 HEAD** 上现建一个 tag
          # ——发出去的包和 tag 指向的代码不是一回事。
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::tag ${TAG} 不存在。手动发布请先 git push origin ${TAG}"
            exit 1
          fi
          VERSION="$(tr -d ' \t\r\n' < VERSION)"
          echo "VERSION=${VERSION}"
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::tag ${TAG} 与 VERSION=${VERSION} 不一致 —— 发版前先同步 VERSION 与 CHANGELOG"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "PUBLISH_TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: 跑全量测试
        run: swift test

      # 检查的是「匿名能不能拉到 appcast」这件事本身（而不是仓库设置），
      # 因为 Sparkle 就是不带你任何凭证去拉 feed 的。
      - name: 检查更新通道可达性
        run: |
          # 这一步只告警、不拦发版：curl 失败（网络抖动/DNS）不能让发版中断，
          # 而 GitHub 的 run 步骤是 `bash -e`，所以必须显式兜底
          CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}" || echo 000)"
          echo "匿名访问 ${GITHUB_REPOSITORY} → HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "::warning::仓库非公开（HTTP ${CODE}）。Sparkle 匿名拉取 \
          https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml 会 404，\
          已安装的用户收不到更新。修法见 docs/RELEASING.md「更新通道的前提」。"
          fi

      - name: 准备签名身份
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE_P12}" ]; then
            echo "未配置 APPLE_CERTIFICATE_P12 —— 走自签路径"
            echo "SIGNED=no" >> "${GITHUB_ENV}"
            exit 0
          fi

          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"

          # 用 openssl 而不是 base64：macOS 自带 base64 解码开关在 -D / --decode
          # 之间随系统版本变化，openssl base64 -d 没有这个歧义（换行也照样吃）。
          printf '%s' "${APPLE_CERTIFICATE_P12}" > "${RUNNER_TEMP}/cert.b64"
          openssl base64 -d -in "${RUNNER_TEMP}/cert.b64" -out "${RUNNER_TEMP}/cert.p12"

          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "${KEYCHAIN_PW}" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" \
            $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN}" \
                      | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "${IDENTITY}" ]; then
            echo "::error::证书导入后找不到 Developer ID Application 身份 —— .p12 内容或密码可能不对"
            exit 1
          fi
          echo "SIGN_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"
          echo "SIGNED=yes" >> "${GITHUB_ENV}"
          echo "签名身份: ${IDENTITY}"

      - name: 构建 App
        env:
          # 发布构建不允许"没有公钥的包"——那种包永远收不到自动更新
          SUISHOUQIAN_REQUIRE_PUBKEY: '1'
        run: bash build.sh --dist-only

      # build.sh 内部已有同样的断言；这里再独立验一遍，防止那条断言被误删
      - name: 校验签名标志（公证要求 Hardened Runtime）
        run: |
          if [ "${SIGNED:-no}" != "yes" ]; then
            echo "自签路径：跳过 runtime 断言"
            exit 0
          fi
          fail=0
          while IFS= read -r -d '' f; do
            flags="$(codesign -d --verbose=2 "$f" 2>&1 | grep -m1 '^CodeDirectory' || true)"
            case "$flags" in
              *runtime*) ;;
              *) echo "::error::$f 缺少 Hardened Runtime（公证会被拒）"; fail=1 ;;
            esac
            case "$flags" in
              *adhoc*) echo "::error::$f 仍是 ad-hoc 签名（公证会被拒）"; fail=1 ;;
            esac
          done < <(find "dist/随手迁.app" -depth \
                     \( -name "*.xpc" -o -name "*.app" -o -name "Autoupdate" \) -print0)
          [ "${fail}" = "0" ] || exit 1
          echo "签名标志校验通过"

      - name: 公证并装订 App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ "${SIGNED:-no}" != "yes" ] || [ -z "${APPLE_ID}" ]; then
            echo "未配 Developer ID 证书或 Apple 账号 —— 跳过公证"
            exit 0
          fi
          ditto -c -k --keepParent "dist/随手迁.app" "${RUNNER_TEMP}/app.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/app.zip" \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" --wait
          xcrun stapler staple "dist/随手迁.app"

      - name: 打包 DMG
        run: bash scripts/package_dmg.sh --no-build

      - name: 公证并装订 DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ "${SIGNED:-no}" != "yes" ] || [ -z "${APPLE_ID}" ]; then
            echo "未配 Developer ID 证书或 Apple 账号 —— 跳过公证"
            exit 0
          fi
          DMG="dist/$(bash scripts/artifact_name.sh)"
          xcrun notarytool submit "${DMG}" \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" --wait
          xcrun stapler staple "${DMG}"
          xcrun stapler validate "${DMG}"

      - name: 从 CHANGELOG 抽出版本说明
        run: |
          awk -v ver="${VERSION}" '
            index($0, "## " ver) == 1 { grab=1; next }
            grab && index($0, "## ") == 1 { exit }
            grab { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md 里找不到「## ${VERSION}」段落，无法生成更新说明"
            exit 1
          fi
          # Sparkle 的更新弹窗会读与安装包**同名**的说明文件（generate_appcast 一并收进
          # appcast）。文件名必须与 DMG 同名不同后缀，所以同样取自 artifact_name.sh。
          DMG_NAME="$(bash scripts/artifact_name.sh)"
          cp release_notes.md "dist/${DMG_NAME%.dmg}.md"
          echo "--- release_notes.md ---"
          cat release_notes.md

      - name: 生成 appcast.xml
        env:
          # 私钥只在这一步可见（CI 上没有登录钥匙串，必须靠它注入）
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/make_appcast.sh

      - name: 发布 GitHub Release（可重跑）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG="dist/$(bash scripts/artifact_name.sh)"
          APPCAST="dist/appcast.xml"
          if gh release view "${PUBLISH_TAG}" >/dev/null 2>&1; then
            # 可重跑：此前用 gh release create，重跑必卡在 "release already exists"，
            # 而如果上一次是 appcast 上传失败，更新通道就一直缺这个资产（用户端 404）
            echo "Release ${PUBLISH_TAG} 已存在 → 覆盖上传资产"
            gh release upload "${PUBLISH_TAG}" "${DMG}" "${APPCAST}" --clobber
          else
            gh release create "${PUBLISH_TAG}" "${DMG}" "${APPCAST}" \
              --title "随手迁 ${PUBLISH_TAG}" \
              --notes-file release_notes.md
          fi

          # 资产完整性自检：appcast 缺失 = 全体用户更新通道静默断掉，必须当场失败
          ASSETS="$(gh release view "${PUBLISH_TAG}" --json assets --jq '.assets[].name')"
          echo "${ASSETS}"
          for want in "$(basename "${DMG}")" "appcast.xml"; do
            if ! printf '%s\n' "${ASSETS}" | grep -qx "${want}"; then
              echo "::error::Release ${PUBLISH_TAG} 缺少资产 ${want}"
              exit 1
            fi
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: suishouqian-dist
          path: |
            dist/*.dmg
            dist/appcast.xml
