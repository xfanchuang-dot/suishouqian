name: tests

# 每次推送/PR 全量回归。签名/公证等分发步骤仍待 Developer ID 账号（v3.0），
# 但"改动必须过全部测试"不需要任何账号，先行制度化。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Run tests
        run: swift test
