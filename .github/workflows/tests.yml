name: tests

# 每次推送/PR 全量回归。签名/公证等分发步骤仍待 Developer ID 账号（v3.0），
# 但"改动必须过全部测试"不需要任何账号，先行制度化。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ── runner 版本不是随便选的 ────────────────────────────────────────────
    # 本项目用了 `Glass` / `.glassEffect`（macOS 26 Liquid Glass），
    # 以及 macOS 26 SDK 才标注 Sendable 的 AppKit 类型（如 AppItem.icon: NSImage?）。
    # `@available(macOS 26, *)` 只挡运行时，挡不住"旧 SDK 里根本没有 Glass 这个类型"，
    # 所以必须用 macOS 26 SDK 编译 —— 即 macos-26 runner。
    #
    # 历史：这里曾是 macos-14（Swift 5.10），与 Package.swift 的 tools-version 6.0
    # 直接冲突，两个 job 都在 20 秒内秒挂；换成 macos-15 后又死在找不到 Glass。
    # 结果就是 CI 徽章长期是红的、测试从来没在 CI 里真跑过。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # 工具链是整条流水线的前置条件，单独断言并给出人话报错。
      # 否则失败会伪装成代码问题（"找不到 glassEffect" / "包版本不符"），极难定位。
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          SDK_VER="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: ${SDK_VER}"
          SDK_MAJOR="${SDK_VER%%.*}"
          if [ -z "${SDK_MAJOR}" ] || [ "${SDK_MAJOR}" -lt 26 ]; then
            echo "::error::需要 macOS 26 SDK（当前 ${SDK_VER:-未知}）。Glass/glassEffect 是 macOS 26 API，旧 SDK 里连类型都不存在。"
            exit 1
          fi
          SWIFT_VER="$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          SWIFT_MAJOR="${SWIFT_VER%%.*}"
          if [ -z "${SWIFT_MAJOR}" ]; then
            echo "::error::无法从 swift --version 解析出 Swift 版本号（输出格式变了？）"
            exit 1
          fi
          if [ "${SWIFT_MAJOR}" -lt 6 ]; then
            echo "::error::需要 Swift 6.0+（Package.swift 为 swift-tools-version 6.0），当前 ${SWIFT_VER}"
            exit 1
          fi
          echo "工具链满足要求: Swift ${SWIFT_VER} / macOS SDK ${SDK_VER}"

      - name: Run tests
        run: swift test

  # 发布脚本冒烟：build.sh / package_dmg.sh 是"代码到用户手上"的必经之路，
  # 而它们此前完全不在 CI 里 —— 新 clone 缺 _bak、签名漏项、覆盖安装拷成嵌套包
  # 这类问题只能在打 tag 时才暴露（那时 release 流水线直接失败）。
  build-scripts:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 语法检查全部脚本
        run: |
          for s in build.sh scripts/*.sh; do
            echo "== ${s}"
            bash -n "${s}"
          done

      - name: 构建 + 签名 + 打 DMG（--dist-only：不装进 /Applications、不启动）
        run: |
          bash build.sh --dist-only
          bash scripts/package_dmg.sh --no-build

      - name: 校验签名与可执行文件覆盖
        run: |
          codesign --verify --strict "dist/随手迁.app"
          # 包内每个可执行文件都必须被签过（Sparkle 的 Autoupdate 曾经漏签，
          # 而它正是公证会被拒的原因之一）
          while IFS= read -r -d '' f; do
            codesign --verify "$f" || { echo "::error::${f} 未签名或签名无效"; exit 1; }
          done < <(find "dist/随手迁.app" -depth \
                     \( -name "*.xpc" -o -name "*.app" -o -name "Autoupdate" \) -print0)
          echo "签名覆盖检查通过"
